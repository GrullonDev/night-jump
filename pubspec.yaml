name: night_jump
description: "Arcade nocturno sin conexión: salta, supera récords y desbloquea temas."

publish_to: 'none' 

version: 1.0.1+2

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  flame: ^1.38.2
  shared_preferences: ^2.5.5
  flame_audio: ^2.12.2
  audioplayers: ^6.8.1
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  # Already used by shared_preferences; exposes the native storage boundary
  # for deterministic rejected/throwing write tests, without runtime additions.
  shared_preferences_platform_interface: ^2.4.2
  flutter_launcher_icons: ^0.14.3

flutter:

  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora.ttf
    - family: Space Grotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf

  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/audio/
